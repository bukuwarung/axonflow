; AxonFlow Customer Portal (governance-console backend API) — prod.
; 
; This is a TEMPLATE. The [environment_unencrypted] section stays plaintext.
; Before committing, sops-encrypt the [secrets] values in place with:
; sops --encrypt --in-place prod.ini
; 
; NOTE: the portal needs the agent's DB migrations (e.g. customer_portal_api_keys)
; to exist first. Deploy the agent before the portal, or expect a short
; crash-loop until the agent finishes migrating.
; 
; Replace every <...> placeholder with the real value first.
[metadata_unencrypted]
app = axonflow-customer-portal
env = prod

[environment_unencrypted]
PORT                          = 8080
; --- Aurora PostgreSQL (same cluster/db as the agent) ---
DATABASE_HOST                 = ai-engineering-production.cluster-cnrcuuembljg.ap-southeast-3.rds.amazonaws.com
DATABASE_PORT                 = 5432
DATABASE_NAME                 = axonflow_production
DATABASE_USER                 = axonflow_writer
DATABASE_SSLMODE              = require
; --- Deployment identity ---
DEPLOYMENT_MODE               = in-vpc-enterprise
ENVIRONMENT                   = production
ORG_ID                        = bukuwarung-eval
TIER                          = Enterprise
AXONFLOW_DB_USE_APP_ROLE      = false
; --- Service-to-service (AWS Cloud Map: prod.bukuwarung-v4.local) ---
AGENT_URL                     = http://axonflow-agent.prod.bukuwarung-v4.local:8080
ORCHESTRATOR_URL              = http://axonflow-orchestrator.prod.bukuwarung-v4.local:8081
; --- Session cookie: keep Secure (true) since the console is served over
; HTTPS through the ALB/UI. Only set false for a plain-HTTP internal test. ---
AXONFLOW_PORTAL_COOKIE_SECURE = true
LOG_LEVEL                     = info


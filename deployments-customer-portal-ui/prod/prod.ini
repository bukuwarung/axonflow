; AxonFlow Customer Portal UI (Next.js governance console) — prod.
; 
; The UI holds no database credentials and no secrets: it server-side-proxies
; /api/v1/* to the portal backend via API_BACKEND_URL. The [secrets] section is
; intentionally empty. Everything here is plaintext; no sops step is needed
; unless you later add a secret.
; 
; Replace every <...> placeholder with the real value first.
[metadata_unencrypted]
app = axonflow-customer-portal-ui
env = prod

[environment_unencrypted]
PORT            = 3000
NODE_ENV        = production
; Force Next.js standalone to bind all interfaces; without this the health
; check on localhost:3000 fails (Next.js binds the container hostname instead).
HOSTNAME        = 0.0.0.0
; Server-side proxy target: the portal backend via Cloud Map (internal, no ALB
; hop). If you instead expose the portal API on the ALB, point this at that
; HTTPS vanity host (must match the cert), e.g. https://axonflow-portal.bukuwarung.com.
API_BACKEND_URL = http://axonflow-customer-portal.prod.bukuwarung-v4.local:8080


[metadata_unencrypted]
app = axonflow-agent
env = prod

[environment_unencrypted]
PORT                            = 8080
; --- Aurora PostgreSQL (existing cluster; writer endpoint) ---
DATABASE_HOST                   = ai-engineering-production.cluster-cnrcuuembljg.ap-southeast-3.rds.amazonaws.com
DATABASE_PORT                   = 5432
DATABASE_NAME                   = axonflow_production
DATABASE_USER                   = axonflow_writer
DATABASE_SSLMODE                = require
; --- Deployment identity ---
DEPLOYMENT_MODE                 = in-vpc-enterprise
DEPLOYMENT_KIND                 = production
ENVIRONMENT                     = production
ORG_ID                          = bukuwarung-eval
TIER                            = Enterprise
AXONFLOW_DB_USE_APP_ROLE        = false
; --- Service-to-service (AWS Cloud Map: prod.bukuwarung-v4.local) ---
ORCHESTRATOR_URL                = http://axonflow-orchestrator.prod.bukuwarung-v4.local:8081
PORTAL_URL                      = http://axonflow-customer-portal.prod.bukuwarung-v4.local:8080
; --- Audit fallback (requires the EFS mount in main.tf) ---
AUDIT_FALLBACK_PATH             = /mnt/efs/audit/audit_fallback.jsonl
; --- Detection posture ---
SQLI_ACTION                     = block
PII_ACTION                      = block
DANGEROUS_QUERY_ACTION          = block
; --- Per-user audit attribution (see .env.example for the trust caveat) ---
AXONFLOW_TRUST_IDENTITY_HEADERS = false
LOG_LEVEL                       = info


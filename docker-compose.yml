# AxonFlow Enterprise - bundled install stack
#
# This file is DERIVED from axonflow-enterprise/docker-compose.enterprise.yml
# (merged with docker-compose.yml base) plus a small set of documented
# customer-facing tweaks. See axonflow-enterprise#2499 Phase 2 for the
# sync workflow.
#
# Customer-facing tweaks (only legitimate divergence from canonical):
#   1. Image registry + SHA-pinned digests        (canonical builds locally)
#   2. Volume paths: docker named volumes only    (canonical uses ./config bind mounts)
#   3. Env-var substitution: customer .env file   (canonical: dev defaults)
#   4. Service network/ports: 127.0.0.1 binding   (canonical exposes 0.0.0.0)
#   5. Bundled axonflow-prometheus + axonflow-grafana images
#      (canonical uses public prom/grafana with bind-mounted config; bundled
#      images bake in the right scrape jobs and dashboards for customers)
#   6. axonflow-customer-portal-ui service        (canonical splits into
#      docker-compose.portal-ui.yml because Grafana takes port 3000 there;
#      install repo remaps Grafana to 3001 so portal-ui gets the 3000 slot)
#   7. otel-collector + tempo + Decision Mode Traces dashboard
#      (folded from the previously open axonflow-install#3; the canonical
#      ships these via docker-compose.otel-grafana.yml separately)
#
# Gap fixes inherited from PR axonflow-enterprise#2500 (closes #2498):
#   G1 — AXONFLOW_INTERNAL_SERVICE_SECRET on agent + orchestrator + customer-portal
#   G4 — audit-data volume on agent at /var/lib/axonflow/audit + AUDIT_FALLBACK_PATH env
#   G5 — DEPLOYMENT_KIND: production on agent + orchestrator
#   G6 — ENVIRONMENT: production + DEPLOYMENT_MODE + ADMIN_API_KEY on customer-portal
#   G7 — NODE_ENV=production + HOSTNAME=0.0.0.0 + /api/healthz on portal-ui
#   G8 — mem_limit + cpus on agent (2g/1.0), orchestrator (2g/1.0),
#        customer-portal (1g/0.5), customer-portal-ui (512m/0.25)
#   G9 — healthcheck commands use curl -f (curl installed in agent + orchestrator
#        + customer-portal Dockerfiles; portal-ui keeps node-based health probe;
#        prometheus + grafana + otel-collector + tempo keep their native probes)

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: axonflow
      POSTGRES_PASSWORD: "${AXONFLOW_DB_PASSWORD}"
      POSTGRES_DB: axonflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axonflow -d axonflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - axonflow-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axonflow-network

  axonflow-agent:
    image: ${AXONFLOW_REGISTRY}/axonflow-agent@${AGENT_DIGEST}
    restart: unless-stopped
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: axonflow
      DATABASE_USER: axonflow
      DATABASE_PASSWORD: "${AXONFLOW_DB_PASSWORD}"
      DATABASE_SSLMODE: disable
      REDIS_URL: redis://redis:6379
      PORT: 8080
      DEPLOYMENT_MODE: in-vpc-enterprise
      AXONFLOW_LICENSE_KEY: "${AXONFLOW_LICENSE_KEY}"
      AXONFLOW_CLIENT_ID: "${AXONFLOW_ORG_ID}"
      AXONFLOW_CLIENT_SECRET: "${AXONFLOW_LICENSE_KEY}"
      ORG_ID: "${AXONFLOW_ORG_ID}"
      AXONFLOW_VERSION: "${AXONFLOW_VERSION}"
      AXONFLOW_DB_USE_APP_ROLE: "false"
      ENVIRONMENT: production
      # G5 — mirror CFN DEPLOYMENT_KIND. Safe to default to `production`
      # here (unlike the axonflow-enterprise canonical overlay) because
      # install.sh enforces a real AXONFLOW_ORG_ID at pre-flight, so the
      # migration 094 prod-safety abort cannot be tripped by a default
      # sentinel ORG_ID. Override in `.env` if you specifically need the
      # dev migration path.
      DEPLOYMENT_KIND: ${DEPLOYMENT_KIND:-production}
      LOG_LEVEL: info
      # G1 — internal service auth shared between agent + orchestrator + portal
      AXONFLOW_INTERNAL_SERVICE_SECRET: "${AXONFLOW_INTERNAL_SERVICE_SECRET}"
      # G2 — JWT secret for user token validation
      JWT_SECRET: "${AXONFLOW_JWT_SECRET}"
      # G4 — audit fallback path (matches the audit-data volume below)
      AUDIT_FALLBACK_PATH: /var/lib/axonflow/audit/audit_fallback.jsonl
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      SQLI_ACTION: block
      PII_ACTION: "${PII_ACTION:-block}"
      DANGEROUS_QUERY_ACTION: block
      # GRAFANA_PASSWORD — consumed by migration 028 (template
      # substitution for the `grafana` Postgres user the bundled
      # axonflow-grafana image authenticates as). Re-uses the same
      # admin password the customer already configured so the install
      # bundle has one fewer env var.
      #
      # Rotation note: changing GRAFANA_ADMIN_PASSWORD post-install
      # updates Grafana's own admin login on next boot, but does NOT
      # re-run migration 028. To rotate the underlying Postgres
      # `grafana` user password, restart axonflow-agent so migration
      # 028's ALTER USER branch re-templates with the new value.
      GRAFANA_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      AXONFLOW_OTEL_ENDPOINT: otel-collector:4317
      AXONFLOW_OTEL_SERVICE_NAME: axonflow-agent
      AXONFLOW_OTEL_SAMPLE_RATE: "1.0"
      # Anonymous platform startup telemetry — inherit the operator's
      # opt-out lever. Set AXONFLOW_TELEMETRY=off in .env to suppress
      # the once-per-binary-per-7-days classification ping. Mirrors the
      # base axonflow-enterprise/docker-compose.yml wiring; previously
      # missing here, which allowed install-stack heartbeats to escape
      # even when the operator set AXONFLOW_TELEMETRY=off at the host.
      AXONFLOW_TELEMETRY: "${AXONFLOW_TELEMETRY:-}"
      AXONFLOW_TELEMETRY_STAMP_DIR: "${AXONFLOW_TELEMETRY_STAMP_DIR:-}"
      CI: "${CI:-}"
      GITHUB_ACTIONS: "${GITHUB_ACTIONS:-}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # G4 — audit fallback storage. The agent's audit_manager.go defaults
      # the fallback path to /var/lib/axonflow/audit/audit_fallback.jsonl;
      # CFN mounts EFS at /mnt/efs/audit; locally we use a named volume.
      - audit-data:/var/lib/axonflow/audit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    # G9 — curl is installed in the agent Dockerfile (platform/agent/Dockerfile:157)
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    # G8 — mirror CFN AgentTaskDefinition Cpu: '1024' / Memory: '2048'
    mem_limit: 2g
    cpus: 1.0
    networks:
      axonflow-network:
        aliases:
          - agent.axonflow.local

  axonflow-orchestrator:
    image: ${AXONFLOW_REGISTRY}/axonflow-orchestrator@${ORCHESTRATOR_DIGEST}
    restart: unless-stopped
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: axonflow
      DATABASE_USER: axonflow
      DATABASE_PASSWORD: "${AXONFLOW_DB_PASSWORD}"
      DATABASE_SSLMODE: disable
      REDIS_URL: redis://redis:6379
      PORT: 8081
      DEPLOYMENT_MODE: in-vpc-enterprise
      AXONFLOW_LICENSE_KEY: "${AXONFLOW_LICENSE_KEY}"
      AXONFLOW_CLIENT_ID: "${AXONFLOW_ORG_ID}"
      AXONFLOW_CLIENT_SECRET: "${AXONFLOW_LICENSE_KEY}"
      ORG_ID: "${AXONFLOW_ORG_ID}"
      AXONFLOW_VERSION: "${AXONFLOW_VERSION}"
      AXONFLOW_DB_USE_APP_ROLE: "false"
      # G5 — mirror CFN DEPLOYMENT_KIND on orchestrator. See the agent
      # block for the rationale on the install-vs-canonical difference.
      DEPLOYMENT_KIND: ${DEPLOYMENT_KIND:-production}
      AGENT_MCP_ENDPOINT: http://axonflow-agent:8080
      LOG_LEVEL: info
      # G1 — must match agent's value for HMAC verification
      AXONFLOW_INTERNAL_SERVICE_SECRET: "${AXONFLOW_INTERNAL_SERVICE_SECRET}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      AXONFLOW_OTEL_ENDPOINT: otel-collector:4317
      AXONFLOW_OTEL_SERVICE_NAME: axonflow-orchestrator
      AXONFLOW_OTEL_SAMPLE_RATE: "1.0"
      # Anonymous platform telemetry opt-out lever (see agent block).
      AXONFLOW_TELEMETRY: "${AXONFLOW_TELEMETRY:-}"
      AXONFLOW_TELEMETRY_STAMP_DIR: "${AXONFLOW_TELEMETRY_STAMP_DIR:-}"
      CI: "${CI:-}"
      GITHUB_ACTIONS: "${GITHUB_ACTIONS:-}"
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      axonflow-agent:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    # G9 — curl is installed in the orchestrator Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    # G8 — mirror CFN OrchestratorTaskDefinition Cpu: '1024' / Memory: '2048'
    mem_limit: 2g
    cpus: 1.0
    networks:
      axonflow-network:
        aliases:
          - orchestrator.axonflow.local

  axonflow-customer-portal:
    image: ${AXONFLOW_REGISTRY}/axonflow-customer-portal@${PORTAL_DIGEST}
    restart: unless-stopped
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: axonflow
      DATABASE_USER: axonflow
      DATABASE_PASSWORD: "${AXONFLOW_DB_PASSWORD}"
      DATABASE_SSLMODE: disable
      ORG_ID: "${AXONFLOW_ORG_ID}"
      TIER: Enterprise
      PORT: 8080
      LOG_LEVEL: info
      AGENT_URL: http://axonflow-agent:8080
      ORCHESTRATOR_URL: http://axonflow-orchestrator:8081
      AXONFLOW_DB_USE_APP_ROLE: "false"
      # G6 — DEPLOYMENT_MODE + ENVIRONMENT + ADMIN_API_KEY mirror CFN portal task def
      DEPLOYMENT_MODE: in-vpc-enterprise
      ENVIRONMENT: production
      ADMIN_API_KEY: "${ADMIN_API_KEY:-}"
      # G1 — must match agent's value for HMAC verification when portal calls agent
      AXONFLOW_INTERNAL_SERVICE_SECRET: "${AXONFLOW_INTERNAL_SERVICE_SECRET}"
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      axonflow-agent:
        condition: service_healthy
    # G9 — curl is installed in the customer-portal Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    # G8 — mirror CFN CustomerPortalTaskDefinition Cpu: '512' / Memory: '1024'
    mem_limit: 1g
    cpus: 0.5
    networks:
      axonflow-network:
        aliases:
          - customer-portal.axonflow.local

  axonflow-customer-portal-ui:
    image: ${AXONFLOW_REGISTRY}/axonflow-customer-portal-ui@${PORTAL_UI_DIGEST}
    restart: unless-stopped
    environment:
      API_BACKEND_URL: http://axonflow-customer-portal:8080
      # G7 — NODE_ENV + HOSTNAME mirror CFN CustomerPortalUITaskDefinition.
      # HOSTNAME=0.0.0.0 forces Next.js standalone to bind all interfaces;
      # without it Next.js only binds the container hostname (e.g. an ECS
      # container-internal name) and the host-side healthcheck times out.
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      axonflow-customer-portal:
        condition: service_healthy
    # G7 — node-based probe mirrors CFN portal-ui healthcheck (wget not
    # available in node:alpine; portal-ui binary ships node).
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/healthz',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    # G8 — mirror CFN CustomerPortalUITaskDefinition Cpu: '256' / Memory: '512'
    mem_limit: 512m
    cpus: 0.25
    networks:
      - axonflow-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:13133:13133"
    depends_on:
      tempo:
        condition: service_healthy
    # NOTE: opentelemetry-collector-contrib is distroless (no shell, no
    # wget/curl), so we cannot run an in-container healthcheck. verify.sh
    # probes 13133/ from the host instead. Downstream services depend on
    # service_started, not service_healthy.
    networks:
      axonflow-network:
        aliases:
          - otel-collector.axonflow.local

  tempo:
    image: grafana/tempo:2.7.2
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/config.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_HTTP_PORT:-3200}:3200"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      axonflow-network:
        aliases:
          - tempo.axonflow.local

  axonflow-prometheus:
    image: ${AXONFLOW_REGISTRY}/axonflow-prometheus@${PROMETHEUS_DIGEST}
    restart: unless-stopped
    environment:
      STACK_NAME: axonflow
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      axonflow-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/prometheus/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - prometheus-data:/prometheus
    # G8 — mirror CFN PrometheusTaskDefinition Cpu: '512' / Memory: '1024'
    mem_limit: 1g
    cpus: 0.5
    networks:
      axonflow-network:
        aliases:
          - prometheus.axonflow.local

  axonflow-grafana:
    image: ${AXONFLOW_REGISTRY}/axonflow-grafana@${GRAFANA_DIGEST}
    restart: unless-stopped
    environment:
      STACK_NAME: axonflow
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      # G3 — bundled axonflow-grafana entrypoint reads GF_DATABASE_* (NOT
      # DATABASE_*) to wire its session DB; the prior install compose used
      # DATABASE_* keys, which the entrypoint silently ignored. The image
      # entrypoint defaults are postgres:5432 / grafana / localdev123, so
      # explicit GF_DATABASE_PASSWORD is required when the operator picks
      # a non-default Postgres password (we re-use AXONFLOW_DB_PASSWORD
      # because Grafana shares the bundled Postgres instance).
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      # The bundled grafana user is created + owned by migration 028
      # (axonflow-enterprise/migrations/core/028_grafana_database.sql);
      # the agent runs that migration with GRAFANA_PASSWORD env =
      # ${GRAFANA_ADMIN_PASSWORD} at boot, so this value must match.
      GF_DATABASE_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_DATABASE_SSL_MODE: disable
      # Bundled image serves at /grafana subpath in production ECS; locally
      # we serve at root, so disable the subpath rewrite.
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      axonflow-prometheus:
        condition: service_healthy
      postgres:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources/tempo.yaml:/etc/grafana/provisioning/datasources/tempo.yaml:ro
      - ./grafana/provisioning/dashboards/decision-mode-traces.json:/var/lib/grafana/dashboards/decision-mode-traces.json:ro
    # G8 — mirror CFN GrafanaTaskDefinition Cpu: '512' / Memory: '1024'
    mem_limit: 1g
    cpus: 0.5
    networks:
      - axonflow-network

volumes:
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  tempo-data:
    driver: local
  # G4 — audit fallback storage for the agent
  audit-data:
    driver: local

networks:
  axonflow-network:
    driver: bridge

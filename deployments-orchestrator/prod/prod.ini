; AxonFlow Orchestrator (control plane: policy management + LLM routing) — prod.
; 
; This is a TEMPLATE. The [environment_unencrypted] section stays plaintext.
; Before committing, sops-encrypt the [secrets] values in place with:
; sops --encrypt --in-place prod.ini
; 
; Replace every <...> placeholder with the real value first.
[metadata_unencrypted]
app = axonflow-orchestrator
env = prod

[environment_unencrypted]
PORT                     = 8081
; --- Aurora PostgreSQL (same cluster/db as the agent) ---
DATABASE_HOST            = ai-engineering-production.cluster-cnrcuuembljg.ap-southeast-3.rds.amazonaws.com
DATABASE_PORT            = 5432
DATABASE_NAME            = axonflow_production
DATABASE_USER            = axonflow_writer
DATABASE_SSLMODE         = require
; --- Deployment identity ---
DEPLOYMENT_MODE          = in-vpc-enterprise
DEPLOYMENT_KIND          = production
ORG_ID                   = bukuwarung-eval
AXONFLOW_DB_USE_APP_ROLE = false
; --- Service-to-service (AWS Cloud Map: prod.bukuwarung-v4.local) ---
AGENT_MCP_ENDPOINT       = http://axonflow-agent.prod.bukuwarung-v4.local:8080
; --- LLM routing (model names are non-secret; API keys go in [secrets]) ---
LLM_ROUTING_STRATEGY     = round_robin
OPENAI_MODEL             = gpt-4.1
ANTHROPIC_MODEL          = claude-haiku-4-5-20251001
LOG_LEVEL                = info

